[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quizverse-live"
version = "0.1.0"
description = "Real-time multiplayer trivia arena built with FastAPI and WebSockets"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "python-dotenv>=1.0,<2.0",
  "SQLAlchemy>=2.0,<3.0",
  "Alembic>=1.14,<2.0",
  "pypdf>=5.0,<7.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1.0", "pytest>=8.0,<9.0"]
browser = ["playwright>=1.50,<2.0"]
postgres = ["psycopg[binary]>=3.2,<4.0"]

[project.scripts]
quizverse-live = "quizverse.__main__:main"
quizverse-seed-builtins = "quizverse.persistence.seeding:main"
quizverse-seed-taxonomy = "quizverse.persistence.taxonomy_seeding:main"
quizverse-seed-exam-collections = "quizverse.persistence.exam_seeding:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -p no:cacheprovider --basetemp=tmp"

[tool.setuptools.packages.find]
include = ["quizverse*"]

[tool.setuptools.package-data]
quizverse = ["static/*.html", "static/*.css", "static/*.js", "migrations/*.mako"]
