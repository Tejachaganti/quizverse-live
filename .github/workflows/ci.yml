name: QuizVerse CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build, Lint & Test (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate JavaScript syntax
        run: |
          node --check quizverse/static/app.js
          node --check quizverse/static/quiz-library.js

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,postgres]"

      - name: Check dependency consistency
        run: |
          python -m pip check

      - name: Verify SQLite database migrations
        env:
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python -m alembic upgrade head
          python -m alembic current
          rm -f ci_test.db

      - name: Verify PostgreSQL dialect and schema compilation
        run: |
          python scripts/verify_postgresql_integration.py

      - name: Run pytest test suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          ENVIRONMENT: "test"
          PYTHONPATH: "."
        run: |
          pytest -v

  postgres-integration:
    name: PostgreSQL Service Integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quizverse_ci
          POSTGRES_USER: quizverse_user
          POSTGRES_PASSWORD: quizverse_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,postgres]"

      - name: Verify live PostgreSQL connectivity & migrations
        env:
          POSTGRES_TEST_URL: postgresql+psycopg://quizverse_user:quizverse_password@localhost:5432/quizverse_ci
          DATABASE_URL: postgresql+psycopg://quizverse_user:quizverse_password@localhost:5432/quizverse_ci
        run: |
          python scripts/verify_postgresql_integration.py
          python -m alembic upgrade head
          python -m alembic current
