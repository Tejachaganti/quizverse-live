services:
  - type: web
    name: quizverse-live-api
    runtime: python
    plan: free
    buildCommand: pip install '.[postgres]'
    startCommand: python -m quizverse
    healthCheckPath: /ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.17
      - key: ENVIRONMENT
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_SIZE
        value: 2
      - key: DB_MAX_OVERFLOW
        value: 1
      - key: DB_POOL_RECYCLE
        value: 1800
      - key: DB_POOL_TIMEOUT
        value: 30
      - key: AI_GENERATION_ENABLED
        value: "false"
      - key: AI_FREE_TIER_ONLY
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
